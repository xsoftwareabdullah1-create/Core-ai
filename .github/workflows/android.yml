name: ULTRON Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: APK variant
        required: true
        default: debug
        type: choice
        options: [debug, release]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Compile Rust core for Android
        run: cargo ndk --target arm64-v8a --platform 26 --output-dir app/src/main/jniLibs build --release --manifest-path native/rust/Cargo.toml
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile Android APK
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'debug' }}
        run: gradle --no-daemon ${BUILD_VARIANT == 'release' && 'assembleRelease' || 'assembleDebug'}
      - name: Prepare named APK
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'debug' }}
        run: |
          mkdir -p output
          if [ "$BUILD_VARIANT" = "release" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk output/ULTRON-AI-unsigned.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk output/ULTRON-AI.apk
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-AI-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14
