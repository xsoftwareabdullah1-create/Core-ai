name: ULTRON Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: APK variant
        required: true
        default: debug
        type: choice
        options: [debug, release]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile Android APK
        run: |
          if [ "${{ inputs.build_variant }}" = "release" ]; then
            gradle --no-daemon assembleRelease
          else
            gradle --no-daemon assembleDebug
          fi
      - name: Prepare named APK
        run: |
          mkdir -p output
          if [ "${{ inputs.build_variant }}" = "release" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk output/ULTRON-AI-unsigned.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk output/ULTRON-AI.apk
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-AI-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14
