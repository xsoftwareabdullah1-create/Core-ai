name: ULTRON Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: APK variant
        required: true
        default: debug
        type: choice
        options: [debug, release]

permissions:
  contents: read

jobs:
  build:
    name: Build ULTRON AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # cargo-ndk runs cargo metadata before compiling. Run from the crate
      # directory so Cargo.toml is discovered reliably.
      - name: Compile Rust core for Android arm64
        working-directory: native/rust
        run: |
          cargo ndk --target arm64-v8a --platform 26 --output-dir ../../app/src/main/jniLibs build --release
          test -f ../../app/src/main/jniLibs/arm64-v8a/libultron_rust.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Android APK
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'debug' }}
        run: |
          if [ "$BUILD_VARIANT" = "release" ]; then
            gradle --no-daemon --stacktrace assembleRelease
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Prepare named APK
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'debug' }}
        run: |
          mkdir -p output
          if [ "$BUILD_VARIANT" = "release" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
            [ -f "$APK_PATH" ] || APK_PATH="app/build/outputs/apk/release/app-release.apk"
            test -f "$APK_PATH"
            cp "$APK_PATH" output/ULTRON-AI-unsigned.apk
          else
            test -f app/build/outputs/apk/debug/app-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk output/ULTRON-AI.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-AI-${{ inputs.build_variant || 'debug' }}-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14
